<main>
<div class="passenger-actions"><button onclick="saveCounts()" type="button">💾 Save Locally</button><button onclick="openArchiveCalendar()" type="button">🗓️ Archive Calendar</button><button class="clear-btn" onclick="clearAllCounts()" type="button">🗑️ Clear All</button></div>

<section class="train-block"><label>Reason / Notes <span style="font-weight:normal">(optional — any information or why STAR Mobile was not used)</span></label><textarea id="reasonNotes" oninput="reasonNotes=this.value;persistSilently()"></textarea></section>
</main><script>
const KEY="xc_staff_app_passenger_counts_v3";
let trains=[];
let reasonNotes="";
function localISODate(date=new Date()){
  const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}
function blank(){return {date:localISODate(),headcode:"",unitNumber:"",fullAndStanding:false,rows:Array.from({length:10},()=>({station:"",first:"",standard:"",submitted:false,starEntered:false}))}}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function formatDateDMY(value){
  if(!value)return "";
  const m=String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?`${m[3]}/${m[2]}/${m[1]}`:String(value);
}
function parseDateDMY(value){
  const m=String(value||"").trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(!m)return null;
  const d=Number(m[1]),mo=Number(m[2]),y=Number(m[3]),dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function updateDateDMY(t,value){
  const parsed=parseDateDMY(value);
  if(parsed){trains[t].date=parsed;persistSilently();}
  else show("Enter the date as DD/MM/YYYY, for example 10/10/2026.");
}
function formatDateInput(input,t){
  const parsed=parseDateDMY(input.value);
  if(parsed){trains[t].date=parsed;input.value=formatDateDMY(parsed);persistSilently();}
  else if(input.value.trim()){show("Enter the date as DD/MM/YYYY, for example 10/10/2026.");input.value=formatDateDMY(trains[t].date);}
}

function addTrain(){trains.push(blank());persistSilently();render()}
function addStation(t){trains[t].rows.push({station:"",first:"",standard:"",submitted:false,starEntered:false});persistSilently();render()}
function persistSilently(){try{localStorage.setItem(KEY,JSON.stringify({trains,reasonNotes}));}catch(e){/* Save Locally reports storage failures to the user. */}}
function update(t,k,v){trains[t][k]=v;persistSilently()} function toggleFullStanding(t){trains[t].fullAndStanding=!trains[t].fullAndStanding;persistSilently();render();}
function updateRow(t,r,k,v){trains[t].rows[r][k]=v;persistSilently();if(k==="first"||k==="standard")updateRowTotal(t,r)}
function rowTotal(r){if(String(r.first??"")===""&&String(r.standard??"")==="")return "";return String(Number(r.first||0)+Number(r.standard||0))}
function updateRowTotal(t,r){const el=document.getElementById(`row-total-${t}-${r}`);if(el)el.textContent=rowTotal(trains[t].rows[r])}
function handleCountInput(input,t,r,k){const digits=String(input.value||'').replace(/\D/g,'').slice(0,3);input.value=digits;updateRow(t,r,k,digits);input.className=countClass(k,digits);persistSilently()}
function countClass(type,v){const n=Number(v); if(v===""||Number.isNaN(n)) return ""; if(type==="standard"){return n<100?"count-black":n<=150?"count-green":n<=200?"count-orange":"count-red"} return n<=8?"count-black":n<=15?"count-green":n<=20?"count-orange":n<=25?"count-red":"count-red-bold"}
function render(){
 const notes=document.getElementById("reasonNotes"); if(notes && notes.value!==reasonNotes) notes.value=reasonNotes;
 document.getElementById("trains").innerHTML=trains.map((t,ti)=>`
 <section class="train-block">
 <h3>Train ${ti+1}</h3><p class="station-row-hint">10 station rows included for this headcode · use ＋ Add Station for more</p>
 <label>Date (DD/MM/YYYY)</label><input type="text" inputmode="numeric" placeholder="DD/MM/YYYY" value="${esc(formatDateDMY(t.date))}" onchange="updateDateDMY(${ti},this.value)" onblur="formatDateInput(this,${ti})">
 <label>Headcode</label><input value="${esc(t.headcode)}" placeholder="e.g. 1V50" oninput="update(${ti},'headcode',this.value)">
  <label>Unit Number (6 digits)</label><input type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" value="${esc(t.unitNumber||"")}" placeholder="e.g. 221101" oninput="update(${ti},'unitNumber',this.value.replace(/\\D/g,'').slice(0,6));this.value=this.value.replace(/\\D/g,'').slice(0,6)" aria-label="Unit Number, six digits">
  <button type="button" class="full-standing-btn ${t.fullAndStanding?'is-active':''}" aria-pressed="${t.fullAndStanding?'true':'false'}" onclick="toggleFullStanding(${ti})">${t.fullAndStanding?'✓ FULL AND STANDING':'⚠ FULL AND STANDING'}</button>
 <table><thead><tr><th scope="col">Station</th><th scope="col">First Class</th><th scope="col">Standard</th><th scope="col">Total Passengers</th><th scope="col">Submitted</th></tr></thead>
 <tbody>${t.rows.map((r,ri)=>`<tr>
 <td><input value="${esc(r.station)}" oninput="updateRow(${ti},${ri},'station',this.value)"></td>
 <td><input class="${countClass('first',r.first)}" type="text" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3" value="${esc(r.first)}" oninput="handleCountInput(this,${ti},${ri},'first')" aria-label="First Class passengers, 0 to 999"></td>
 <td><input class="${countClass('standard',r.standard)}" type="text" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3" value="${esc(r.standard)}" oninput="handleCountInput(this,${ti},${ri},'standard')" aria-label="Standard passengers, 0 to 999"></td>
 <td class="row-total" style="text-align:center;font-weight:800;font-variant-numeric:tabular-nums" id="row-total-${ti}-${ri}" aria-label="Total passengers, calculated automatically">${esc(rowTotal(r))}</td>
 <td style="text-align:center"><input type="checkbox" aria-label="Station count submitted" ${r.submitted?"checked":""} onchange="updateRow(${ti},${ri},'submitted',this.checked)"></td>
 </tr>`).join("")}</tbody></table>
 <div class="passenger-actions" style="margin-top:10px"><button type="button" onclick="addStation(${ti})">＋ Add Station</button></div>
 </section>`).join("")
}
function saveCounts(){
  try{localStorage.setItem(KEY,JSON.stringify({trains,reasonNotes}));show("Passenger counts saved locally.");return true;}
  catch(e){show("Unable to save locally. Check browser storage settings or available space.");return false;}
}

function clearAllCounts(){
  const ok=window.confirm("Clear all passenger counts currently on this form, including train details and Reason / Notes? Archived reports will not be deleted.");
  if(!ok)return;
  trains=[blank()];
  reasonNotes="";
  persistSilently();
  render();
  show("Form cleared. Archived reports have been kept.");
  window.scrollTo({top:0,behavior:"smooth"});
}


let archiveViewDate = new Date();
let archiveSelectedDate = "";
function getArchiveItems(){
  try{return JSON.parse(localStorage.getItem("xc_passenger_counts_archive_v1")||"[]")}catch(e){return []}
}
function setArchiveItems(items){localStorage.setItem("xc_passenger_counts_archive_v1",JSON.stringify(items))}
function archiveCounts(){
  const invalid=trains.find(t=>(t.unitNumber||"")!==""&&!/^\d{6}$/.test(t.unitNumber));
  if(invalid){show("Unit Number must be exactly six digits.");return;}
  const archiveKey="xc_passenger_counts_archive_v1";
  const day=(trains[0]&&trains[0].date)||localISODate();
  const archive=getArchiveItems();
  archive.unshift({id:Date.now().toString(),archiveDate:day,archivedAt:new Date().toISOString(),trains:JSON.parse(JSON.stringify(trains)),reasonNotes:typeof reasonNotes==="undefined"?"":reasonNotes});
  setArchiveItems(archive);
  saveCounts();
  show("Passenger counts archived for "+day+".");
  archiveSelectedDate=day;
  openArchiveCalendar();
}
function openArchiveCalendar(){
  const panel=document.getElementById("archive-calendar-panel");
  if(!panel)return;
  panel.hidden=false;
  if(!archiveSelectedDate)archiveSelectedDate=localISODate();
  const parts=archiveSelectedDate.split("-").map(Number);
  if(parts.length===3&&parts[0])archiveViewDate=new Date(parts[0],parts[1]-1,1);
  renderArchiveCalendar();
  panel.scrollIntoView({behavior:"smooth",block:"start"});
}
function closeArchiveCalendar(){const panel=document.getElementById("archive-calendar-panel");if(panel)panel.hidden=true;}
function changeArchiveMonth(delta){archiveViewDate=new Date(archiveViewDate.getFullYear(),archiveViewDate.getMonth()+delta,1);renderArchiveCalendar();}
function renderArchiveCalendar(){
  const label=document.getElementById("archive-month-label"),grid=document.getElementById("archive-calendar-grid");
  if(!label||!grid)return;
  label.textContent=archiveViewDate.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const items=getArchiveItems(),dates=new Set(items.map(a=>a.archiveDate||((a.trains||[])[0]||{}).date||((a.archivedAt||"").slice(0,10))));
  const y=archiveViewDate.getFullYear(),m=archiveViewDate.getMonth();
  const first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  let out="";
  for(let i=0;i<offset;i++)out+='<button class="archive-day empty" tabindex="-1" aria-hidden="true"></button>';
  for(let d=1;d<=days;d++){
    const date=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const has=dates.has(date),selected=archiveSelectedDate===date;
    out+='<button type="button" class="archive-day'+(has?' has-archive':'')+(selected?' selected':'')+'" onclick="selectArchiveDate(\''+date+'\')" aria-label="'+date+(has?', archived counts':'')+'">'+d+'</button>';
  }
  grid.innerHTML=out;
  renderArchiveDay();
}
function selectArchiveDate(date){archiveSelectedDate=date;renderArchiveCalendar();}
function renderArchiveDay(){
  const target=document.getElementById("archive-day-records");if(!target)return;
  const items=getArchiveItems().filter(a=>(a.archiveDate||((a.trains||[])[0]||{}).date||(a.archivedAt||"").slice(0,10))===archiveSelectedDate);
  if(!items.length){target.innerHTML='<div class="archive-empty">No passenger counts archived for '+archiveSelectedDate+'.</div>';return;}
  target.innerHTML='<h3>Archived counts — '+archiveSelectedDate+'</h3>'+items.map((a,i)=>{
    const trains=a.trains||[];
    const summary=trains.map((t,j)=>'<p><strong>'+escapeArchiveText(t.headcode||"No headcode")+'</strong> · Unit '+escapeArchiveText(t.unitNumber||"Not entered")+' · '+(t.fullAndStanding?'<strong>FULL AND STANDING</strong>':'')+'</p>').join("");
    const stamp=a.archivedAt?new Date(a.archivedAt).toLocaleString():"";
    return '<article class="archive-record"><h3>Archive '+(items.length-i)+' <small>'+escapeArchiveText(stamp)+'</small></h3>'+summary+'<button type="button" onclick="restoreArchive(\''+String(a.id||"")+'\')">Restore to form</button><button type="button" class="archive-delete" onclick="deleteArchive(\''+String(a.id||"")+'\')">Delete archive</button></article>';
  }).join("");
}
function escapeArchiveText(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function restoreArchive(id){
  const item=getArchiveItems().find(a=>String(a.id||"")===String(id));
  if(!item)return;
  if(!confirm("Restore these archived counts into the active form? Current unsaved form contents will be replaced."))return;
  trains=JSON.parse(JSON.stringify(item.trains||[]));
  if(typeof reasonNotes!=="undefined"&&item.reasonNotes!==undefined)reasonNotes=item.reasonNotes;
  if(typeof render==="function")render();
  if(typeof saveCounts==="function")saveCounts();
  show("Archived passenger counts restored.");
  closeArchiveCalendar();
}
function deleteArchive(id){
  if(!confirm("Delete this archived snapshot? This cannot be undone."))return;
  setArchiveItems(getArchiveItems().filter(a=>String(a.id||"")!==String(id)));
  renderArchiveCalendar();
  show("Archive deleted.");
}

function clearAll(){if(!confirm("Are you sure you want to clear all passenger count data?"))return;trains=[blank()];reasonNotes="";localStorage.removeItem(KEY);render();const n=document.getElementById("reasonNotes");if(n)n.value="";show("All passenger counts cleared.")}
function show(x){document.getElementById("status").textContent=x;setTimeout(()=>document.getElementById("status").textContent="",2500)}
function reportRows(){return trains.flatMap((t,i)=>t.rows.filter(r=>r.station||r.first||r.standard).map(r=>[r.station,r.first||"",r.standard||""]))}

 trains.forEach((t,i)=>{

   doc.autoTable({startY:57,head:[["STATION","FIRST CLASS","STANDARD","TOTAL PASSENGERS"]],body:rows.length?rows:[["No passenger counts entered","","",""]],theme:"grid",margin:{left:12,right:12,bottom:25},styles:{font:"helvetica",fontSize:8,cellPadding:2.5,lineColor:[205,205,205],lineWidth:.25,textColor:[35,35,35],valign:"middle",overflow:"linebreak"},headStyles:{fillColor:[181,18,27],textColor:[255,255,255],fontStyle:"bold",fontSize:7.5},alternateRowStyles:{fillColor:[248,248,248]},columnStyles:{0:{cellWidth:51},1:{cellWidth:29,halign:"center"},2:{cellWidth:29,halign:"center"},3:{cellWidth:43,halign:"center"}}});
 });

 if(notes){let y=doc.lastAutoTable?.finalY||57;if(y>245){doc.addPage();y=20;}else y+=9;doc.setTextColor(181,18,27);doc.setFontSize(10);doc.setFont(undefined,"bold");doc.text("REASON / NOTES",15,y);doc.setTextColor(35,35,35);doc.setFontSize(9);doc.setFont(undefined,"normal");const lines=doc.splitTextToSize(notes,180);doc.text(lines,15,y+6);}
 xcAddPdfFooters(doc);return doc.output("blob");

async function generatePDF(){try{let blob=await makePDF();let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="XC-Passenger-Counts.pdf";a.click();show("PDF generated.")}catch(e){show("")}}

async function emailCounts(){

<script id="passenger-count-validation-v151">
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('input[type="number"]').forEach(function (input) {
    input.addEventListener('input', function () {
      var digits = this.value.replace(/\D/g, '').slice(0, 3);
      if (digits === '') { this.value = ''; return; }
      var n = parseInt(digits, 10);
      if (!Number.isFinite(n)) { this.value = ''; return; }
      this.value = Math.min(999, Math.max(0, n));
    });
    input.addEventListener('keydown', function (e) {
      if (['e','E','+','-','.'].includes(e.key)) e.preventDefault();
    });
  });
});
