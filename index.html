<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A50034">
<meta name="description" content="Passenger count recorder for train crew">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<title>Passenger Count</title>
<style>
:root{--red:#a50034;--gold:#f4c542;--ink:#20232a;--muted:#626875;--line:#d9dde4;--bg:#f3f5f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
header{background:var(--red);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 15px}.headrow{display:flex;align-items:center;gap:12px}.brandmark{width:42px;height:42px;border:2px solid #fff;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:21px;flex:none}h1{font-size:1.25rem;margin:0;font-weight:800}header p{margin:3px 0 0;font-size:.86rem;opacity:.9}
main{max-width:1000px;margin:0 auto;padding:12px;display:grid;gap:12px}.card,.train-card{background:#fff;border-radius:14px;padding:13px;box-shadow:0 2px 8px #1822300b;border:1px solid #e9ebef}h2{font-size:1rem;margin:0 0 11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{min-width:0}.field label{display:block;font-size:.82rem;font-weight:700;margin-bottom:5px;color:#414753}input,textarea{font:inherit;width:100%;min-width:0;border:1px solid #cbd0d9;border-radius:9px;padding:9px 10px;background:#fff;color:var(--ink);min-height:42px}textarea{resize:vertical}input:focus,textarea:focus{outline:2px solid #a5003444;border-color:var(--red)}
.checkline{display:flex;align-items:center;gap:9px;padding-top:10px;font-weight:650;font-size:.9rem}.checkline input{width:20px;height:20px;min-height:auto;accent-color:var(--red)}
.tablewrap{overflow-x:hidden;border:1px solid var(--line);border-radius:9px}table{border-collapse:collapse;width:100%;table-layout:fixed;background:#fff}th,td{border-bottom:1px solid #e5e7eb;padding:5px 3px;text-align:center;vertical-align:middle}th{font-size:.72rem;background:#f1f2f5;font-weight:800}td:first-child,th:first-child{width:35%;text-align:left}th:nth-child(2),th:nth-child(3){width:22%}th:last-child{width:21%}td input{padding:7px 2px;text-align:center;min-height:38px;border-radius:6px;font-size:.92rem}
td input[type=number]{appearance:textfield;-moz-appearance:textfield}
td input[type=number]::-webkit-inner-spin-button,td input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
td.capacity-green{background:#e2f5e8}td.capacity-amber{background:#fff2c7}td.capacity-red{background:#ffe0e3}
td.capacity-green input{background:#f3fff6;border-color:#78c58e}td.capacity-amber input{background:#fffaf0;border-color:#e0bd58}td.capacity-red input{background:#fff5f6;border-color:#e39aa6}
.capacity-legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px;font-size:.75rem;color:var(--muted)}
.capacity-legend span{display:inline-flex;align-items:center;gap:5px}.capacity-dot{display:inline-block;width:11px;height:11px;border-radius:3px}
td.station input{text-align:left;padding-left:6px}td.total{font-weight:800;font-variant-numeric:tabular-nums;font-size:.9rem}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}button{border:0;border-radius:9px;min-height:43px;padding:10px 12px;font:700 .92rem system-ui;cursor:pointer;background:var(--gold);color:#222}button.primary{background:var(--red);color:#fff}button.secondary{background:#eceff3;color:#20232a;border:1px solid #d9dde4}button.danger{background:#fff0f2;color:#9d1235;border:1px solid #efc3ce}
.train-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.train-heading h2{margin:0}.train-heading .remove{min-height:34px;padding:6px 10px;font-size:.8rem}.small{font-size:.8rem;color:var(--muted)}#preview{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8f9fb;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:.9rem;min-height:70px}footer{text-align:center;color:#747985;font-size:.75rem;padding:8px 14px}
@media(min-width:700px){main{padding:16px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card,.train-card{padding:16px}td:first-child,th:first-child{width:40%}th:nth-child(2),th:nth-child(3){width:20%}th:last-child{width:20%}}
@media(max-width:360px){main{padding:7px}.card,.train-card{padding:9px}.grid{gap:7px}.actions{gap:6px}button{font-size:.84rem;padding:9px 7px}th{font-size:.67rem}td input{font-size:.85rem}}
</style>
</head>
<body>
<header><div class="headrow"><div class="brandmark">XC</div><div><h1>Passenger Count</h1><p>Record and export passenger counts</p></div></div></header>
<main>
<section class="card">
<h2>Date and reason / notes — applies to all trains</h2>
<div class="grid">
<div class="field"><label for="date">Date</label><input id="date" type="date"></div>
<div class="field" style="grid-column:span 2"><label for="reason">Reason for counts not being entered / notes for the day</label><textarea id="reason" rows="2" placeholder="e.g. Ticket machine battery dead, no machines available, or other notes for the day"></textarea></div>
</div>
</section>
<section class="card">
<div class="train-heading"><h2>Trains</h2><button id="addTrain" class="primary" aria-label="Add train">+ Add train</button></div>
<div id="trains"></div>
</section>
<section class="card">
<h2>Report</h2>
<div class="actions"><button id="generate" class="primary">Generate report</button><button id="copy">Copy report</button><button id="email" class="secondary" style="grid-column:1 / -1">Email report</button></div>
<div style="margin-top:12px"><label class="small" for="preview">Report preview</label><div id="preview" aria-live="polite">Generate a report to preview it here.</div></div>
</section>
</main>
<footer>Passenger Count</footer>
<script>
const $=id=>document.getElementById(id);
const now=new Date(),localDate=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);
$('date').value=localDate;
let trains=[],nextId=1,reportText='';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function valid(v){let n=Number(v);return Number.isFinite(n)?Math.max(0,Math.floor(n)):0}
function addTrain(){
 const id=nextId++,t={id,headcode:'',unit:'',full:false,entries:Array.from({length:15},()=>({station:'',first:'',standard:''}))};
 trains.push(t);renderTrains();
 document.getElementById('train-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});
}
function renderTrains(){
 const host=$('trains');host.innerHTML='';
 trains.forEach((t,idx)=>{
  const card=document.createElement('section');card.className='train-card';card.id='train-'+t.id;
  card.innerHTML=`<div class="train-heading"><h2>Train ${idx+1}</h2>${trains.length>1?'<button class="danger remove" data-remove="'+t.id+'">Remove train</button>':''}</div>
  <div class="grid">
   <div class="field"><label>Headcode</label><input data-field="headcode" maxlength="4" placeholder="1V50" value="${esc(t.headcode)}" autocapitalize="characters"></div>
   <div class="field"><label>Unit number</label><input data-field="unit" inputmode="numeric" maxlength="6" placeholder="6 digits" value="${esc(t.unit)}"></div>
  </div>
  <label class="checkline"><input data-field="full" type="checkbox" ${t.full?'checked':''}> This train was full and standing for a portion of its journey</label>
  <div class="capacity-legend"><span><i class="capacity-dot" style="background:#e2f5e8"></i> Low (0–99)</span><span><i class="capacity-dot" style="background:#fff2c7"></i> Busy (100–149)</span><span><i class="capacity-dot" style="background:#ffe0e3"></i> High (150+)</span></div>
  <div class="tablewrap"><table aria-label="Passenger counts for train ${idx+1}"><thead><tr><th>Station</th><th>First</th><th>Standard</th><th>Total</th></tr></thead><tbody>${t.entries.map((e,i)=>`<tr><td class="station"><input data-row="${i}" data-col="station" aria-label="Station ${i+1}" placeholder="Station" value="${esc(e.station)}"></td><td><input data-row="${i}" data-col="first" type="number" min="0" step="1" inputmode="numeric" aria-label="First count at station ${i+1}" value="${esc(e.first)}" placeholder="0"></td><td><input data-row="${i}" data-col="standard" type="number" min="0" step="1" inputmode="numeric" aria-label="Standard count at station ${i+1}" value="${esc(e.standard)}" placeholder="0"></td><td class="total">${valid(e.first)+valid(e.standard)}</td></tr>`).join('')}</tbody></table></div>`;
  card.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{
   const field=el.dataset.field;
   if(field==='headcode')el.value=el.value.toUpperCase().replace(/[^0-9A-Z]/g,'').slice(0,4);
   if(field==='unit')el.value=el.value.replace(/\D/g,'').slice(0,6);
   t[field]=field==='full'?el.checked:el.value;
  }));
  card.querySelectorAll('[data-row]').forEach(el=>el.addEventListener('input',()=>{
   const i=Number(el.dataset.row),col=el.dataset.col;t.entries[i][col]=el.value;
   const row=el.closest('tr');const total=valid(t.entries[i].first)+valid(t.entries[i].standard);row.querySelector('.total').textContent=total;row.querySelectorAll('td').forEach(td=>td.classList.remove('capacity-green','capacity-amber','capacity-red'));const grade=total>=150?'capacity-red':total>=100?'capacity-amber':'capacity-green';row.querySelectorAll('td').forEach((td,j)=>{if(j>0)td.classList.add(grade);});
  }));
  card.querySelectorAll('[data-remove]').forEach(btn=>btn.addEventListener('click',()=>{if(confirm('Remove this train and its counts?')){trains=trains.filter(x=>x.id!==Number(btn.dataset.remove));renderTrains();}}));
  card.querySelectorAll('tbody tr').forEach(row=>{const cells=row.querySelectorAll('td');const total=valid(row.querySelector('[data-col="first"]').value)+valid(row.querySelector('[data-col="standard"]').value);const grade=total>=150?'capacity-red':total>=100?'capacity-amber':'capacity-green';cells.forEach((td,j)=>{if(j>0)td.classList.add(grade);});});
  host.appendChild(card);
 });
}
function dateUK(d){if(!d)return '';const p=d.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d;}
function reportFor(t,idx){
 const lines=[`TRAIN ${idx+1}: ${t.headcode||'Headcode not entered'}`];if(t.unit)lines.push(`UNIT: ${t.unit}`);
 if(t.full)lines.push('This Train was full and standing for a portion of its journey');
 lines.push('');
 t.entries.filter(e=>e.station||e.first!==''||e.standard!=='').forEach(e=>lines.push(`${e.station||'Station not entered'} - ${valid(e.first)} - ${valid(e.standard)} - (total ${valid(e.first)+valid(e.standard)} passengers)`));
 return lines.join('\n');
}
function buildReport(){
 for(const t of trains){if(t.headcode&&!/^[0-9][A-Z][0-9]{2}$/.test(t.headcode)){alert('Enter a valid 4-character headcode, e.g. 1V50.');return false;}if(t.unit&&!/^\d{6}$/.test(t.unit)){alert('Unit number must be six digits.');return false;}}
 const chunks=[`PASSENGER COUNTS — ${dateUK($('date').value||localDate)}`];if($('reason').value.trim())chunks.push('Reason / Notes: '+$('reason').value.trim());chunks.push('');
 trains.forEach((t,i)=>chunks.push(reportFor(t,i)));reportText=chunks.join('\n\n--------------------\n\n');$('preview').textContent=reportText;return true;
}
$('addTrain').onclick=addTrain;
$('generate').onclick=buildReport;
$('copy').onclick=async()=>{if(!buildReport())return;try{await navigator.clipboard.writeText(reportText);alert('Report copied.')}catch(e){alert('Copy is not available in this browser. Select the report preview and copy it manually.')}};
$('email').onclick=()=>{if(!buildReport())return;const subject=encodeURIComponent('Passenger counts on '+dateUK($('date').value||localDate)+' for '+trains.map(t=>t.headcode||'HEADCODES').join(', '));let body=[];if($('reason').value.trim())body.push($('reason').value.trim());body.push('');trains.forEach((t,i)=>{body.push((t.headcode||'Headcode')+(t.full?' — TRAIN WAS FULL AND STANDING':''));body.push('');t.entries.filter(e=>e.station||e.first!==''||e.standard!=='').forEach(e=>body.push(`${e.station||'Station not entered'} - ${valid(e.first)} - ${valid(e.standard)} - (total ${valid(e.first)+valid(e.standard)} passengers)`));if(i<trains.length-1)body.push('','--------------------','');});window.location.href='mailto:?subject='+subject+'&body='+encodeURIComponent(body.join('\n'));};
addTrain();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
